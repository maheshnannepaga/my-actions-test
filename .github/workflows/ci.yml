name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: true
        default: 'Manual test run'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install flake8
        run: pip install flake8
      - name: Run linter
        run: flake8 .

  test-310:
    needs: lint
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.10"
    secrets:
      MY_API_KEY: ${{ secrets.MY_API_KEY }}

  test-311:
    needs: lint
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.11"
    secrets:
      MY_API_KEY: ${{ secrets.MY_API_KEY }}

  test-312:
    needs: lint
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.12"
    secrets:
      MY_API_KEY: ${{ secrets.MY_API_KEY }}
